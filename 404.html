<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена — Путь к миру</title>
    <link rel="icon" type="image/png" href="images/logo_favicon_512.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page { text-align: center; padding: 120px 20px; min-height: 70vh; display: flex; align-items: center; justify-content: center; background: var(--color-bg-light); }
        .error-code { font-family: var(--font-accent); font-size: 8rem; color: var(--color-primary); line-height: 1; margin-bottom: 20px; opacity: 0.8; }
        .error-title { font-size: 2rem; margin-bottom: 15px; }
        .error-desc { color: var(--color-text-gray); margin-bottom: 30px; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="error-page">
        <div>
            <div class="error-code">404</div>
            <h1 class="error-title">Упс! Страница не найдена</h1>
            <p class="error-desc">Возможно, она была удалена, или вы ошиблись в адресе.</p>
            <a href="index.html" class="btn btn--primary btn--large">Вернуться на главную</a>
        </div>
    </div>
</body>
</html>
