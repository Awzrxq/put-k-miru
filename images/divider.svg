<svg viewBox="0 0 600 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Боковые линии (строго по центру) -->
  <line x1="60" y1="20" x2="270" y2="20" stroke="#8CA8C6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="330" y1="20" x2="540" y2="20" stroke="#8CA8C6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Цветок в центре -->
  <g transform="translate(300, 20)">
    <!-- Желтый бутон (как в "пушке-гонке", но макушка чуть мягче) -->
    <path d="M 0,8 C -6,0 -6,-14 0,-17 C 6,-14 6,0 0,8 Z" fill="#F4C430"/>
    
    <!-- Левый зеленый лепесток (ровно как в удачной версии) -->
    <path d="M 0,8 C -14,8 -16,-6 -8,-12 C -4,-4 -2,2 0,8 Z" fill="#2E7D32"/>
    
    <!-- Правый зеленый лепесток -->
    <path d="M 0,8 C 14,8 16,-6 8,-12 C 4,-4 2,2 0,8 Z" fill="#2E7D32"/>
  </g>
</svg>
